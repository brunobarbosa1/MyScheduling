# ==========================================================
# docker-compose do MyScheduling (PostgreSQL + API)
#
# As variáveis vêm do arquivo .env na RAIZ do repositório.
# Execute a partir da RAIZ do projeto:
#
#   docker compose --env-file .env -f UI/MyScheduling.API/docker-compose.yml up -d --build
#
# Para derrubar:
#   docker compose --env-file .env -f UI/MyScheduling.API/docker-compose.yml down
# ==========================================================

services:
  db:
    image: postgres:16-alpine
    container_name: myscheduling-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: UI/MyScheduling.API/Dockerfile
    container_name: myscheduling-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres_data:
